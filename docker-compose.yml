services:
  # ── PostgreSQL ──
  db:
    image: postgres:16
    container_name: appointment_db
    restart: unless-stopped
    command: [ "postgres", "-c", "timezone=Asia/Bangkok" ]
    env_file: .env.docker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (Express API) ──
  backend:
    build: ./backend
    container_name: appointment_api
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend (Next.js) ──
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    container_name: appointment_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
